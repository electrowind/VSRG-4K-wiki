site_name: 下落式音游齐民要术
site_url: https://electrowind.github.io/VSRG-4K-wiki

theme:
  language: 'zh'
  name: material
  # 日间 / 夜间两套配色，首次访问跟随系统偏好，页头右侧的按钮可切换
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: nthing
      primary: white
      accent: green
      toggle:
        icon: material/weather-night
        name: 切换到夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: 切换到日间模式

  logo: assets/logo-black.png
  favicon: assets/favicon.png

  features:
    - search.highlight
    - navigation.instant
    - navigation.tabs
    # - navigation.footer
    - content.action.edit
    - content.action.view

  # font:
  #   text: uuz

repo_url: https://github.com/electrowind/VSRG-4K-wiki
repo_name: electrowind/VSRG-4K-wiki

plugins:
  - search
  - font-switch:
      storage_key: vsrg-font
      fonts:
        - id: uuz
          label: 幽
          title: 隶灵黑
          src: fonts/uuz.woff2
          fallback: fonts/uuz.otf

  # - git-committers:
  #     repository: electrowind/VSRG-4K-wiki
  #     branch: main

markdown_extensions:
   - pymdownx.arithmatex:
       generic: true
   - pymdownx.betterem

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home:
    - 前言: index.md
  - 基本常识: common.md
  - 键型:
    - Index: pattern/index.md
    - 排列: pattern/pailie.md
    - 常规: pattern/rice.md
    - 面条: pattern/LN.md
    - Vibro: pattern/vibro.md
    - 变速: pattern/SV.md
  - 写谱: mapping.md
  - 难度体系:
    - 段位: difficulty-rate/dan.md
    - 星数: difficulty-rate/starrate.md
    - 不同体系的转换: difficulty-rate/conversation.md

  - 游玩技巧:
    - Index: playing/index.md
    - 快捷键: playing/hotkey.md
    - 网站: playing/website.md
    - 插件: playing/plugin.md
    - 辅助软件: playing/software.md
    - 游玩姿势: playing/posture.md
    - 皮肤: playing/skin.md
    - 外设: playing/peripheral.md
    - 练习谱: playing/practice.md
    - 刷 PP: playing/pp.md
    - 私服: playing/private-server.md
    - 鉴挂: playing/cheat-check.md
    - 多人游戏: playing/multiplayer.md
    - 组织与战队: playing/team.md
    - 比赛: playing/tournament.md

  - 专用名词:
    - Index: terms/index.md
    - 官方名词: terms/official.md
    - 分度·越级·串·读·糊·拍: terms/basic.md
    - 段落·比·藏·热手·龙·和解: terms/section.md
    - Acc 定级法·卖弱·KPS: terms/accuracy.md
    - 放置飞升·投皮·等效 BPM: terms/speed.md
    - 联机相关·主难次难: terms/mp.md
    - 歌曲、谱面别称: terms/nickname.md
    - 其他俚语: terms/misc.md

  - 常见事件及人物:
    - Index: history/index.md
    - pp 系统: history/pp.md
    - 分数系统: history/score.md
    - 玩家: history/player.md
    - Rank 区进化史: history/rank.md
    - 段位首杀与制作: history/dan.md
    - StepMania: history/stepmania.md

  - 附录:
    - 段位下载方式: appendix/appxA.md
    - 段位难度天梯表: appendix/appxB.md
    - 有争议的数据: appendix/appxC.md
    - 其他文献: appendix/appxD.md

  - 后记: postscript.md
